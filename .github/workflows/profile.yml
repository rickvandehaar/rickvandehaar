# Regenerates the live parts of the profile (activity card + contribution snake)
# and publishes them to the `output` branch, which the README reads from.
name: profile

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Activity card
        run: pnpm activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          OUT_DIR: dist

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#6f38c5&color_dots=#efebf5,#dccdf7,#b999ee,#8b5cf6,#6f38c5
            dist/snake-dark.svg?color_snake=#c1a6ea&color_dots=#1f1b27,#3b2766,#5b3aa0,#8b5cf6,#c1a6ea

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore(profile): regenerate activity and snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
